[project]
name = "terramind_x"
version = "0.1.0"
description = "TerraMind-X AI-powered agriculture decision intelligence backend."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
keywords = ["agriculture", "AI", "FastAPI", "LangGraph", "Groq", "PostgreSQL"]

[project.dependencies]
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.23.0"}
sqlalchemy = "^2.0"
alembic = "^1.11"
"psycopg[binary]" = ">=3.3.4,<4.0"
asyncpg = "^0.29.0"
pydantic = "^2.8"
pydantic-settings = "^2.0"
httpx = "^0.28.0"
networkx = "^3.1"
langgraph = "^0.1.0"
xgboost = "^1.7.5"
aiosqlite = "^0.19.0"
python-dotenv = "^1.0.0"

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.13.3"]
# For local testing and database support
postgres = ["psycopg[binary]", "asyncpg>=0.29.0"]


[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pyright]
extraPaths = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "asyncio: mark test as async test"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pydantic.PydanticDeprecatedSince20"
]



