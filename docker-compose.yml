version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terramind_x_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/terramind_x}
      - EXPLABS_API_KEY=${EXPLABS_API_KEY:-your_explabs_api_key_here}
      - EXPLABS_BASE_URL=${EXPLABS_BASE_URL:-https://api.experientiallabs.ai/v1}
      - EXPLABS_MODEL=${EXPLABS_MODEL:-gpt-6-astra}
      - N8N_BASE_URL=${N8N_BASE_URL:-http://n8n:5678}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-terramind_n8n_skey_2026}
    depends_on:
      - db
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  db:
    image: postgres:15-alpine
    container_name: terramind_x_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-terramind_x}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: terramind_x_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-terramind_admin_2026}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-terramind_n8n_encryption_key_2026}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend

volumes:
  postgres_data:
  n8n_data:
